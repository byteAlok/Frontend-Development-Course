<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: rgb(152, 223, 223);
            border: 0;
            transition: background-color 0.5s ease, 
                        color 0.5s ease, font-size 0.5s ease-in-out;
        }
        button:hover{
            background-color: chartreuse;
            color: rgb(255, 0, 0);
            font-size: 24px;
        }

     /*   div{
            border: 1px solid;
            width: 100px;
            height: 100px;
            transition: width 2s ease-in-out, height 3s ease;
        }
        div:hover{
            width:100%;
            background-color: chartreuse;
            height: 400px;
        }*/
        div{
            border: 1px solid;
            width: 100px;
            height: 100px;
            margin: auto;
            position: relative;
            top: 100px;
            opacity: 0.2;
            background-color: chartreuse;
            /*transition: transform 1s ease, border-radius 1s ease,
                        opacity 1s ease;*/
            transition: all 1s ease 2s;
        }
        div:hover{
            transform: scale(2) rotate(45deg);
            border-radius: 50%;
            opacity: 1;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    <div>
        <!-- <h1>Heading</h1> -->
    </div>
</body>
</html>
