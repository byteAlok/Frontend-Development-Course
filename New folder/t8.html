<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ease vs Ease-in vs Ease-out vs Ease-in-out</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 25px;
        }

        h2 {
            margin: 0;
            text-align: center;
        }

        .container {
            width: 80%;
            background: #ddd;
            height: 60px;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .box {
            width: 50px;
            height: 50px;
            background: #2196f3;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 5px;
            transition: all 2s;
        }

        /* Different timing functions */
        .ease {
            transition-timing-function: ease;
        }

        .ease-in {
            transition-timing-function: ease-in;
        }

        .ease-out {
            transition-timing-function: ease-out;
        }

        .ease-in-out {
            transition-timing-function: ease-in-out;
        }

        /* When active class is added */
        .move {
            left: calc(100% - 60px);
            background: #ff4081;
        }
    </style>
</head>

<body>

    <h2>Click anywhere to play the animation 🚀</h2>

    <div class="container">
        <div class="box ease"></div>
    </div>
    <div class="container">
        <div class="box ease-in"></div>
    </div>
    <div class="container">
        <div class="box ease-out"></div>
    </div>
    <div class="container">
        <div class="box ease-in-out"></div>
    </div>
    <div class="container">
        <div class="box"></div>
    </div>

    <script>
        document.body.addEventListener("click", () => {
            document.querySelectorAll(".box").forEach(b => {
                b.classList.toggle("move");
            });
        });
    </script>
</body>

</html>
