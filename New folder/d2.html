<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>icon</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .container{
            width: 80%;
            height: 60px;
            background-color: rgb(132, 200, 229);
            margin: 10px auto;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 10px;
            transition: all 5s;
        }
        .ease{
            transition-timing-function: ease;
        }
        .ease-in{
            transition-timing-function: ease-in;
        }
        .ease-out{
            transition-timing-function: ease-out;
        }
        .ease-in-out{
            transition-timing-function: ease-in-out;
        }

        .move{
            left: calc(100% - 60px);
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>Ease, Ease-in, Ease-out, Ease-in-out, None</h1>
    <div class="container">
        <div class="box ease"></div>
    </div>
    <div class="container">
        <div class="box ease-in"></div>
    </div>
    <div class="container">
        <div class="box ease-out"></div>
    </div>
    <div class="container">
        <div class="box ease-in-out"></div>
    </div>
    <div class="container">
        <div class="box"></div>
    </div>

</body>

<script>
    document.body.addEventListener("click", ()=>{
        document.querySelectorAll(".box").forEach(d => {
            d.classList.toggle("move")
        })
    })


</script>

</html>
