<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backdrop Filter Example</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1500&q=80') no-repeat center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .glass-card {
        width: 350px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(141, 33, 33, 0.32); /* ✅ transparency added */
        backdrop-filter: blur(2px) brightness(100%);
        /*filter: blur(2px);*/
        -webkit-backdrop-filter: blur(100px) brightness(300%);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        text-align: center;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
    }

    h2 {
        margin-bottom: 10px;
        font-size: 24px;
    }

    p {
        font-size: 16px;
    }
</style>
</head>
<body>

    <div class="glass-card">
        <h2>Backdrop Filter Effect</h2>
        <p>Blur + Brightness combined using CSS backdrop-filter.</p>
    </div>

</body>
</html>
