<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d h2{
            /*text-shadow: h-offset v-offset blur-radius color;*/

            text-shadow: -1px 1px 1px rgb(0, 110, 112);
        }
        #d{
            /*box-shadow: h-offset v-offset blur-radius spread-radius color inset;*/
            box-shadow: -5px 0px 2px 1px red inset, 10px -10px 2px 1px rgb(0, 199, 7),-5px 10px 2px 1px rgb(0, 4, 226)  ;
            background-color: aquamarine;
            height: 100px;
            width: 200px;
        }
        #p{
            font-family: 'Arial Narrow Bold', sans-serif;
            font-size: 28px;
            font-weight:bold; /* thin bold bolder */

        }
        p{
            text-align: left; /* left right justify start end*/
            text-transform: none;
            /* capitalize lowercase uppercase none*/
            text-decoration:none;
            /* underline overline none*/
            line-height: 35px;

            letter-spacing: 1px;
            
            word-spacing: 20px;


        }
    </style>
</head>
<body>
    <div>fsfgsfjs</div>

    <div id="d">

        <h2>Text-Shadow</h2>
    </div>
    
    <!-- Typography in css -->

    <p id="p">Typography</p>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur maxime accusamus facilis dolores porro, earum dolore? Placeat mollitia laborum earum dolores animi ipsa vero reprehenderit! Aliquid tempora minima facilis perferendis.</p>



</body>
</html>
