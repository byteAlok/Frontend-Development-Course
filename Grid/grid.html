<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Named Grid Tracks</title>
  <style>
    .container {
      width: 90%;
      height: 70vh;
      border: 2px solid black;
      display: grid;

      /*  Named Tracks */
      grid-template-columns: [first] 150px [second] 150px [third] 150px [end];
      grid-template-rows: [top] 100px [center] 100px [bottom] 100px [end];
      gap: 10px;
      justify-content: center;
      align-content: center;
    }

    .item {
      background: lightcoral;
      border: 2px solid red;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    /* Named placement */
    .item1 {
      grid-column: first / second;
      /* from 'first' line to 'second' line */
      grid-row: top / center;
      /* from 'top' line to 'center' line */
      background: lightblue;
    }

    .item2 {
      grid-column: second / third;
      grid-row: center / bottom;
      background: lightgreen;
    }

    .item3 {
      grid-column: first / third;
      /* span multiple columns using names */
      grid-row: bottom / end;
      background: lightyellow;
    }

    /* .item1 {
            grid-row-start: 1;
            grid-column-start: 1;
            grid-row-end: 3;
            grid-column-end: 3;
            } 

        grid-area: <row-start> / <column-start> / <row-end> / <column-end>;
        grid-area: 1 / 1 / 3 / 3;
      
    */
  </style>
</head>

<body>
  <div class="container">
    <div class="item item1">Item 1</div>
    <div class="item item2">Item 2</div>
    <div class="item item3">Item 3</div>
  </div>
</body>

</html>
