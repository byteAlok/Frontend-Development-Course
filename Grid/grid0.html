<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Justify & Align Content Example</title>
  <style>
    .container {
      width: 95%;
      height: 85vh;
      border: 2px solid black;
      display: grid;

      /* Grid cells setup */
      /*grid-template-columns: 250px 400px 150px 70px;*/
      /*grid-template-columns: 1fr 1fr 1fr 1fr;*/
      grid-template-columns: repeat(4, 200px);

      grid-template-rows: repeat(2, 200px);

      /*grid-template-rows: repeat(2, 150px);*/
      /*gap: 20px 50px; */
      /*column-gap: 20px;
      row-gap: 30px;*/

      justify-content: space-evenly;
      align-content: start;

      /*justify-items: center;
      align-items: center;*/

    }

    .container div {
      background: lightcoral;
      border: 2px solid red;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;

      width: 120px;
      height: 120px;
    }
    #d3{
      
    }
  </style>
</head>
<body>
  <div class="container">
    <div>1</div>
    <div>2</div>
    <div id="d3">3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>

 
</body>
</html>
