<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Areas Example</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 150px 1fr 150px;
            /* 3 columns */
            grid-template-rows: 80px 1fr 60px;
            /* 3 rows */

            grid-template-areas:
                "header header header"
                "menu   main   sidebar"
                "footer footer footer";

            /* 
                +---------+-----------+----------+
                | header  |  header   | header   |
                +---------+-----------+----------+
                | menu    |   main    | sidebar  |
                +---------+-----------+----------+
                | footer  |  footer   | footer   |
                +---------+-----------+----------+
            */ 

            gap: 10px;
            height: 100vh;
        }

        /* Assigning areas to elements */
        header {
            grid-area: header;
            background: lightcoral;
        }

        nav {
            grid-area: menu;
            background: lightgreen;
        }

        main {
            grid-area: main;
            background: lightblue;
        }

        aside {
            grid-area: sidebar;
            background: khaki;
        }

        footer {
            grid-area: footer;
            background: plum;
        }

        /* Common styling */
        header,
        nav,
        main,
        aside,
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            border: 2px solid #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>HEADER</header>
        <nav>MENU</nav>
        <main>MAIN CONTENT</main>
        <aside>SIDEBAR</aside>
        <footer>FOOTER</footer>
    </div>
</body>

</html>
