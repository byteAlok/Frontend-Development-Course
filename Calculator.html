<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .box {
            width: 356px;
            height: 550px;
            background-color: rgb(27, 74, 73);
            border-radius: 10px;
            overflow: hidden;
            margin: auto;
            padding: 24px;

        }

        #data {
            background-color: aliceblue;
            width: 100%;
            height: 90px;
            margin: 10px auto;
            border-radius: 10px;
            font-size: 32px;
            text-align: right;
        }

        .btns {
            margin: 16px 0px 10px 0px;
        }

        button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 15%;
            font-size: 28px;
            margin: 8px;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="box">
            <input type="text" id="data" readonly/>
            <div class="btns">

                <button id="" onclick="allClear()">AC</button>
                <button id="" onclick="btnValue('%')">%</button>
                <button id="" onclick="clearOne()">C</button>
                <button id="" onclick="btnValue('/')">/</button>
                <br />
                <button id="" onclick="btnValue('7')">7</button>
                <button id="" onclick="btnValue('8')">8</button>
                <button id="" onclick="btnValue('9')">9</button>
                <button id="" onclick="btnValue('*')">x</button>
                <br />
                <button id="" onclick="btnValue('4')">4</button>
                <button id="" onclick="btnValue('5')">5</button>
                <button id="" onclick="btnValue('6')">6</button>
                <button id="" onclick="btnValue('-')">-</button>
                <br />
                <button id="" onclick="btnValue('1')">1</button>
                <button id="" onclick="btnValue('2')">2</button>
                <button id="" onclick="btnValue('3')">3</button>
                <button id="" onclick="btnValue('+')">+</button>
                <br />
                <button id="" onclick="btnValue('00')">00</button>
                <button id="" onclick="btnValue('0')">0</button>
                <button id="" onclick="btnValue('.')">.</button>
                <button id="" onclick="calcData()">=</button>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('data')
        let clearScreen = false

        function btnValue(a)
        {
            if (clearScreen)
            {
                display.value = ""
                clearScreen = false
            }
            clearScreen = false
            display.value = display.value + a
        }
        function allClear()
        {
            display.value = ""
        }
        function clearOne()
        {
            display.value = display.value.slice(0, -1)
        }

        function calcData()
        {
            try{
                display.value = eval(display.value)
                clearScreen = true
            }
            catch{
                display.value = "Error"
            }
        }
    </script>





</body>

</html>
