<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <h2 class="text-2xl font-semibold text-center py-6 bg-blue-200 mb-8">Calculator</h2>

    <div class="flex justify-center">
        <div class=" bg-blue-900 p-6 rounded-[10px] ">
            <div class="m-0 p-0 flex justify-center">
                <input id="display" type="text" readonly class="w-full py-3 px-4 text-right rounded" />
            </div>
            <br>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('AC')">AC</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('%')">%</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('clear')">✕</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('/')">/</button>
            <br>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('7')">7</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('8')">8</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('9')">9</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('*')">*</button>
            <br>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('4')">4</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('5')">5</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('6')">6</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('-')">-</button>
            <br>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('1')">1</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('2')">2</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('3')">3</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('+')">+</button>
            <br>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('00')">00</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('0')">0</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('.')">.</button>
            <button class="bg-gray-100 m-1 py-4 px-6 font-semibold rounded-[10px] " onclick="cal('=')">=</button>
        </div>
    </div>

    <script>

        var display = document.getElementById('display');

        function cal(inp) {
            
            if ( inp == 'AC')
            {
                display.value = "";
            }
            else if (inp == 'clear')
            {
                display.value = display.value.slice(0, -1)
            }
            else if(inp == '=')
            {
                //display.value = eval(display.value)
                try {
                    display.value = eval(display.value)
                }
                catch{
                    display.value = "Error";
                }
            }
            else{
                display.value = display.value + inp;
            }
        }


    </script>

</body>

</html>
